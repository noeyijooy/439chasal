<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>루카</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: #e9e9e9;
      color: #111;
      font-family: "Noto Serif KR", serif;
    }

    body {
      display: flex;
      justify-content: center;
    }

    .page {
      width: 100%;
      max-width: 920px;
      min-height: 100vh;
      padding: 42px 18px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    #text {
      width: 100%;
      text-align: center;
      font-size: 16px;
      line-height: 2;
      font-weight: 500;
      white-space: pre-line;
      word-break: keep-all;
    }

    .segment {
      margin-bottom: 24px;
      transition: color 0.25s ease, opacity 0.25s ease;
    }

    .segment.past {
      color: #9a9a9a;
    }

    .segment.current {
      color: #111;
    }

    .segment.emphasis {
      letter-spacing: 0.02em;
    }

    .btn-area {
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 10px;
      position: sticky;
      bottom: 10px;
      padding-top: 12px;
      background: linear-gradient(to top, rgba(233,233,233,0.98), rgba(233,233,233,0));
    }

    .btn {
      font-family: "Noto Serif KR", serif;
      font-size: 14px;
      font-weight: 600;
      padding: 10px 14px;
      min-width: 78px;
      border-radius: 14px;
      border: 2px solid #111;
      background: #fff;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.12s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn:disabled {
      opacity: 0.42;
      cursor: default;
      transform: none;
    }

    .btn-normal {
      color: #111;
      border-color: #111;
      background: #fff;
    }

    .btn-dialogue {
      color: #8a0f4d;
      border-color: #8a0f4d;
      background: #fff5fa;
    }

    #overlayBlack,
    #overlayWhite {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      z-index: 999;
    }

    #overlayBlack { background: #000; }
    #overlayWhite { background: #fff; }

    .shake {
      animation: shake 0.28s linear;
    }

    @keyframes shake {
      0% { transform: translate(0, 0); }
      20% { transform: translate(-4px, 2px); }
      40% { transform: translate(4px, -2px); }
      60% { transform: translate(-3px, 1px); }
      80% { transform: translate(3px, -1px); }
      100% { transform: translate(0, 0); }
    }

    @media (max-width: 768px) {
      .page {
        padding: 38px 16px 28px;
      }

      #text {
        font-size: 15.5px;
        line-height: 1.95;
      }

      .segment {
        margin-bottom: 22px;
      }

      .btn {
        font-size: 14px;
        padding: 10px 12px;
        min-width: 74px;
      }
    }
  </style>
</head>
<body>
  <div id="overlayBlack"></div>
  <div id="overlayWhite"></div>

  <div class="page" id="pageWrap">
    <div id="text"></div>

    <div class="btn-area">
      <button id="prevBtn" class="btn btn-normal">이전</button>
      <button id="nextBtn" class="btn btn-normal">다음</button>
    </div>
  </div>

  <script>
    const pages = [
      {
        text: `유리창이 하얗게 변해 스러진다.
마력의 포화 탓이다.
시위에 둥글게 모였던 엘리아스의 손끝이 허공으로 펼쳐진다.
푸르게 빛나는 화살이 맹렬히 날아가 한 폭주자의 심장을 꿰뚫는다.`,
        speaker: "narration"
      },
      {
        text: `[아아아아악!]
듣기 힘든 낮은 비명이 진흙 사이로 터져나온다.
엘리아스가 다음 화살을 만들며 나직이 말했다.
“명중.”`,
        speaker: "narration"
      },
      {
        text: `“…….”`,
        speaker: "me"
      },
      {
        text: `“이런 것에 기뻐한 적은 없었는데.”`,
        speaker: "other"
      },
      {
        text: `나는 말없이 그의 얼굴을 바라봤다.`,
        speaker: "narration"
      },
      {
        text: `“아니, 기뻐하고 싶지 않았는데.”`,
        speaker: "other"
      },
      {
        text: `침묵이 흐른다.
엘리아스는 말없이 화살을 끼우고 활시위를 당겼다.`,
        speaker: "narration"
      },
      {
        text: `콰앙!`,
        speaker: "narration",
        effect: "shake",
        emphasis: true
      },
      {
        text: `또다시, 비명. 그리고 사람이 쓰러진다.
나는 창가 앞 기둥에 마력을 휘감고 그리로 날아가, 책상을 쾅 밟았다.
다음 화살을 장전하기 전 엘리아스가 손을 튕겨 중심 잡는 것을 도왔다.
걷는 것은 무리여도 날아가는 것은 할 수 있다.
마력이 중간에 끊기지 않는다면.`,
        speaker: "narration",
        actionLabel: "날아간다"
      },
      {
        text: `한번 더 도약한 나는 창틀에 비스듬히 앉아 창을 활짝 열었다.
닥쳐 오는 비트리올이 내가 공중에 뿌려 둔 신력에 녹는다.
엘리아스는 그 사이 시위를 한번 더 당겼고, 놓았다.
다시 한번 더.
두 명을 더 쓰러뜨린 그가 이제 나를 바라본다.
나는 아까 그랬듯 스태프를 어깨에 얹었다.
거리를 두고 양손으로 대를 잡은 뒤 입을 열었다.`,
        speaker: "narration",
        actionLabel: "창을 연다"
      },
      {
        text: `―네 의를 빛같이 나타내시며 네 공의를 정오의 빛같이 하시리로다.`,
        speaker: "me"
      },
      {
        text: `콰과과광―!!`,
        speaker: "narration",
        effect: "whiteflash",
        emphasis: true
      },
      {
        text: `수많은 신력 덩어리가 김나지움의 트랙 위, 진흙으로 뒤덮인 인간에게로 내리꽂힌다.
비명이 산포한다.
나는 그 공기를 들이마시며 한번 더 신력을 끌어냈다.`,
        speaker: "narration"
      },
      {
        text: `“엘리.”`,
        speaker: "me"
      },
      {
        text: `“응.”`,
        speaker: "other"
      },
      {
        text: `“이제 말하는 거지만… 마력만의 세계에 다녀온 적 있어.”`,
        speaker: "me"
      },
      {
        text: `“뭐?”`,
        speaker: "other"
      },
      {
        text: `피잉―`,
        speaker: "narration",
        emphasis: true
      },
      {
        text: `엘리아스의 화살이 폭주자의 머리 옆을 비껴 날아간다.
퍼뜩 정신을 차린 그가 활을 고쳐 잡고 시위를 당겼다.
대화하기 위해 스태프를 내려놓을 시간은 없다.
엘리아스는 머릿속에서 시위의 탄성과 활과 화살대와 화살촉의 각기 다른 경도를 위한 마법식을 동시에 굴리고 있을 테니 대화를 받아들이기 힘들겠지만, 그래도 지금 이야기해야 했다.`,
        speaker: "narration"
      },
      {
        text: `“유체이탈로 가능한 일이야. 그런데―”`,
        speaker: "me"
      },
      {
        text: `“우리는 유체이탈하지 않았잖아.”`,
        speaker: "other"
      },
      {
        text: `“그래. 그 말을 하고 싶었어.
우리는 영혼 상태로 온 게 아니라 육신이 있는 채로 저 폭주자들하고 같이 떨어졌어.
여기가 아스트랄계라면….”`,
        speaker: "me"
      },
      {
        text: `콰앙―! 퍼억―`,
        speaker: "narration",
        effect: "shake",
        emphasis: true
      },
      {
        text: `신력에도 쓰러지지 않은 자들 중 하나가 쓰러진다.
엘리아스의 화살촉은 심장에 꽂혔다가 응축되었던 마력을 전신으로 퍼뜨렸다.
신체였던 진흙이 산산이 흩날린다.
나는 눈을 질끈 감고 고개를 돌렸다.
그러고는 어깨에 기대 두었던 스태프를 아래로 꺾었다가 위로 쳐올리며 말했다.`,
        speaker: "narration"
      },
      {
        text: `“그게 어떻게 가능하지? ―형제들아, 너희는 어두움에 있지 아니하매 그 날이 도적 같이 너희에게 임하지 못하리니!”`,
        speaker: "me"
      },
      {
        text: `콰아아아아아―`,
        speaker: "narration",
        effect: "whiteflash",
        emphasis: true
      },
      {
        text: `폭포수처럼 쏟아지는 신력이 운동장 전체를 뒤덮었다.
눈을 뜨기 힘들 만큼 밝은 빛 직후, 순간 눈앞이 검게 변했다.`,
        speaker: "narration",
        effect: "blackout"
      },
      {
        text: `피 냄새가 났다.
시야의 블랙아웃이 걷히고서도 전신에 튀며 흐르는 신력 탓에 앞이 보이지 않았지만, 엘리아스가 고개를 돌리는 것이 여기까지 느껴졌다.
나는 대를 잡았던 왼손으로 코와 입을 닦아내며, 단어와 단어와 단어 사이를 끊어 분명히 말했다.`,
        speaker: "narration"
      },
      {
        text: `“앞에 봐.”`,
        speaker: "me"
      },
      {
        text: `제대로 말했기를 바란다.
손이 내 뜻대로 움직이지 않고 제멋대로 뺨과 눈을 찔렀다.
기껏 닦아 놓았더니 허사다.
다시 앞이 까맣게 변했다.`,
        speaker: "narration",
        effect: "blackout"
      },
      {
        text: `그래도, 마력의 흐름만은 내게 선명했다.
엘리아스의 숨이 빨라진다.
숨을 억누른 그가 거리에서 김나지움으로 달려드는 폭주자들의 심장을 겨누었다.
운동장의 트랙에 모인 폭주자들은 내 신력에 비명을 질러댔다.
진흙이 녹아 사라진다.
나는 그들이 끊임없이 사방으로 밀어보내는 비트리올을 억누르려 노력하며 주문을 이어 외웠다.`,
        speaker: "narration"
      },
      {
        text: `―너희는 다 빛의 아들이요 낮의 아들이라, 우리가 밤이나 어두움에 속하지 아니하나니.`,
        speaker: "me"
      },
      {
        text: `[끄아아아악! 아아아아….]
엘리아스가 말한 것처럼 꺽꺽거리는 소리가 들린다.
숨이 넘어가고 있다.
폐가 남아 있는지 없는지도 모르는 자들에게서 생명의 소리가 났다.`,
        speaker: "narration"
      },
      {
        text: `환멸이 전신을 뒤덮는다.
잘 살아보고자 하는 자들이 그러기 위해 무고한 자들을 죽인다.
저들이 모두 교도소에 수감되었던 범죄자라고 해서 이렇게 진흙이 되어 죽을 이유는 없었다.
이 모든 비극이 한낱 인간의 욕구에서 시작된다는 것을 아직도 믿을 수 없었다.
사사로운 바람과 알량한 믿음이 시대를 파괴하고 있었다.
언제나 그랬듯이.
우리가 다 빛에 속한 사람들이라고 외쳐 봐야 무슨 소용인가―빛의 아들이 빛의 아들을 죽여야 하는 세계에서.`,
        speaker: "narration"
      },
      {
        text: `번뇌는 항상 A.D.의 21세기나 여기나 인간의 본질이 놀라울 만큼 그대로란 명징한 현실에 이르고서야 환멸로 변화한다.
내가 언제나 지독한 무력을 느끼고 마는 것은 이것의 근원이 이 세계만의 고유함을 갖지 않는다는 것이다.
인간은 상황에 맞춰 적응했고 껍데기만 다른 여전한 폭력을 그럴듯한 이름으로 포장해 벌이고 있었다.
뚫린 입이라고 이것이 바로 신의 은총이라고들 지껄이는 마력이 세상에 도래해도 인간은 마찬가지였다.
은총은 무슨.
내가 신자유주의의 시대에 있든 마법의 시대에 있든, 인간은 언제나―`,
        speaker: "narration"
      },
      {
        text: `콰앙―!`,
        speaker: "narration",
        effect: "shake",
        emphasis: true
      },
      {
        text: `[아아아아아악! 살려줘―!]
H, i, l, f, e―아직 성대가 붙은 누군가의 목소리가 조각조각 분해된다.
목소리가 내 정신을 이 자리로 끌어낸다.
나는 얼굴을 일그러뜨렸다.
내가 왜 이 자리에서 저들의 세계를 파괴해야 하는지 알 수 없었다.
누구의 잘못으로, 누구의 탐욕으로?
그러나 만악의 시원으로 거슬러 올라가는 것은 지금 불필요했다.
지금은 내 앞에 닥친 상황을 끝내야 했다.
계단으로 누군가 뛰어올라오는 소리가 들린다.
한둘의 손이 아닌 것이 철문을 쾅쾅 두들긴다.
나는 몸을 훅 돌려 바닥을 내리치며 주문을 외웠다.`,
        speaker: "narration",
        actionLabel: "돌아선다"
      },
      {
        text: `콰아아앙―!`,
        speaker: "narration",
        effect: "whiteflash",
        emphasis: true
      },
      {
        text: `―전에 고통하던 자에게는 흑암이 없으리로다.
흑암에 행하던 백성이 큰 빛을 보고 사망의 그늘진 땅에 거하던 자에게 빛이 비취도다.
전에 고통하는 자에게 흑암이 있다, 지금, 이 순간에.`,
        speaker: "me"
      },
      {
        text: `새하얀 신력이 철문 아래로 밀려나간다.
그 순간, 엘리아스가 내 어깨를 잡아당겼다.`,
        speaker: "narration",
        effect: "whiteflash"
      },
      {
        text: `“루카.”`,
        speaker: "other"
      },
      {
        text: `그가 나를 들쳐 안고는 책상을 밟고 반대쪽 창가로 뛰었다.`,
        speaker: "narration"
      },
      {
        text: `쿠웅― 쾅!`,
        speaker: "narration",
        effect: "shake",
        emphasis: true
      },
      {
        text: `실험대 울리는 소리.
엘리아스가 숨을 섞어 말했다.`,
        speaker: "narration"
      },
      {
        text: `“이제 그만. 저 사람들 계속 늘어나고 있어.”`,
        speaker: "other"
      },
      {
        text: `늘어나고 있다, 라.
나도 그렇게 생각한다.
엘리아스는 창을 양옆으로 활짝 열고, 창틀에 발을 올렸다.
그러고는 창틀을 떠밀며 도약했다.`,
        speaker: "narration"
      },
      {
        text: `콰앙―!`,
        speaker: "narration",
        effect: "shake",
        emphasis: true
      },
      {
        text: `“…!”`,
        speaker: "me"
      },
      {
        text: `바깥 바람이 우리를 덮친다.
나는 입을 벌리고 아래를 내다봤다.
관목과 보도블럭이 빠르게 스쳐지나간다.
심지어 가로등까지도.
그는 지붕 위를 뛰고 있었다.
그가 건물의 끝에서 몸을 낮추고는, 다음 건물을 향해 뛰었다.`,
        speaker: "narration"
      },
      {
        text: `쾅―`,
        speaker: "narration",
        effect: "shake",
        emphasis: true
      },
      {
        text: `나는 반사적으로 눈을 질끈 감았다.
엘리아스는 이런 짓을 자주 해 본 사람답게―내가 이곳에 오기 전 읽기로는 그랬다―조금도 아랑곳하지 않고 말했다.`,
        speaker: "narration"
      },
      {
        text: `“우리 점점 뮌헨 중심부로 올라가고 있는 거 알아?”`,
        speaker: "other"
      },
      {
        text: `“알아, 워…. 허, 그보다, 이런 게….”`,
        speaker: "me"
      },
      {
        text: `엘리아스는 왜인지 아무 말이 없었다.
그는 손에 좀 더 힘을 주었다.
그러고는 누가 들어도 연기하는 것 같은 목소리로 중얼거렸다.`,
        speaker: "narration"
      },
      {
        text: `“얼마 전에 초등학교 졸업한 사람으로서 이 정도는 해 줘야지.”`,
        speaker: "other"
      },
      {
        text: `“…….”`,
        speaker: "me"

        text: `나는, 내가 나로 살기 위해서, 인간다움을 잊지 않기 위해서, 도저히 입 밖에 내고 싶지 않았던 말을 내뱉었다.
그래야 했다, 이제는.`,
        speaker: "narration"
      },
      {
        text: `“네 피가 필요해.”`,
        speaker: "me"
      }
    ];

    let index = 0;

    const textEl = document.getElementById("text");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const overlayBlack = document.getElementById("overlayBlack");
    const overlayWhite = document.getElementById("overlayWhite");
    const pageWrap = document.getElementById("pageWrap");

    function cleanDialogueLabel(text) {
      const firstLine = text.split("\n")[0].trim();
      return firstLine
        .replace(/^“/, "")
        .replace(/”$/, "")
        .replace(/^‘/, "")
        .replace(/’$/, "")
        .replace(/^"/, "")
        .replace(/"$/, "");
    }

    function getNextButtonInfo() {
      if (index >= pages.length - 1) {
        return { label: "끝", type: "normal" };
      }

      const nextPage = pages[index + 1];

      if (nextPage.actionLabel) {
        return { label: nextPage.actionLabel, type: "normal" };
      }

      if (nextPage.speaker === "me") {
        return { label: cleanDialogueLabel(nextPage.text), type: "dialogue" };
      }

      return { label: "다음", type: "normal" };
    }

    function flash(element, duration = 180) {
      element.style.transition = "none";
      element.style.opacity = "1";
      void element.offsetWidth;
      element.style.transition = "opacity 0.18s ease";
      setTimeout(() => {
        element.style.opacity = "0";
      }, duration);
    }

    function playEffect(effectName) {
      if (!effectName) return;

      if (effectName === "blackout") {
        flash(overlayBlack, 260);
      }

      if (effectName === "whiteflash") {
        flash(overlayWhite, 170);
      }

      if (effectName === "shake") {
        pageWrap.classList.remove("shake");
        void pageWrap.offsetWidth;
        pageWrap.classList.add("shake");
      }
    }

    function render() {
      textEl.innerHTML = "";

      for (let i = 0; i <= index; i++) {
        const div = document.createElement("div");
        div.className = "segment";
        div.textContent = pages[i].text;

        if (pages[i].emphasis) {
          div.classList.add("emphasis");
        }

        if (i < index) {
          div.classList.add("past");
        } else {
          div.classList.add("current");
        }

        textEl.appendChild(div);
      }

      prevBtn.disabled = index === 0;
      nextBtn.disabled = index === pages.length - 1;

      const nextInfo = getNextButtonInfo();
      nextBtn.textContent = nextInfo.label;

      nextBtn.classList.remove("btn-normal", "btn-dialogue");
      nextBtn.classList.add(nextInfo.type === "dialogue" ? "btn-dialogue" : "btn-normal");

      setTimeout(() => {
        window.scrollTo({
          top: document.body.scrollHeight,
          behavior: "smooth"
        });
      }, 30);

      playEffect(pages[index].effect);
    }

    prevBtn.addEventListener("click", () => {
      if (index > 0) {
        index--;
        render();
      }
    });

    nextBtn.addEventListener("click", () => {
      if (index < pages.length - 1) {
        index++;
        render();
      }
    });

    render();
  </script>
</body>
</html>
